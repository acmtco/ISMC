[project]
name = "hronograf"
version = "0.1.0"
description = "Интеллектуальная система мониторинга строительной площадки — видеопоток в машино-часы"
requires-python = ">=3.11"
readme = "README.md"
# Только то, что нужно работающему сервису. Всё остальное — в extras ниже:
# развёрнутому стенду не нужны ни обучение детектора, ни генерация
# синтетики, ни построение графиков, а `ultralytics` тянет за собой PyTorch
# (более 500 МБ), из-за чего образ разбухает и долго собирается на ARM.
dependencies = [
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "sqlmodel>=0.0.22",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Детектор: обучение и инференс. `services/perception/detect.py` импортирует
# ultralytics лениво, поэтому без этой группы сервис поднимается и работает
# в режиме replay, а при попытке опросить камеру честно сообщает, чего не хватает.
ml = ["ultralytics>=8.3"]
# Генерация синтетического бенчмарка.
synth = ["Pillow>=10.0", "tqdm>=4.66"]
# Сквозная оценка качества: графики и метрики трекинга.
eval = ["matplotlib>=3.8", "motmetrics>=1.4"]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hronograf[ml,synth,eval]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Фикстуры читаются нагляднее одной строкой, чем искусственно перенесённые.
"tests/*" = ["E501"]
# `Depends(...)` в значении по умолчанию — стандартная идиома FastAPI, не баг.
"services/api/routers/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
