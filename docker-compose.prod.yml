# Развёртывание на собственном сервере. Два режима.
#
# 1. На сервере уже стоит nginx с другими сайтами — порты 80 и 443 заняты:
#
#      docker compose -f docker-compose.prod.yml up -d --build app
#
#    Приложение слушает 127.0.0.1:8000 и снаружи недоступно; наружу его
#    отдаёт ваш nginx (готовый конфиг — `deploy/nginx/hronograf.conf`),
#    он же занимается сертификатом.
#
# 2. Сервер пустой, порты свободны:
#
#      docker compose -f docker-compose.prod.yml --profile tls up -d --build
#
#    Дополнительно поднимется Caddy, который сам получит и продлит
#    сертификат Let's Encrypt для домена из HG_DOMAIN.
#
# Данные лежат в именованном томе: база переживает пересборку образа,
# в отличие от развёртывания на эфемерной файловой системе.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HG_MODE: "${HG_MODE:-replay}"
      HG_OBJECT_ID: "${HG_OBJECT_ID:-OBJ-001}"
      HG_LOG_LEVEL: "${HG_LOG_LEVEL:-INFO}"
      # Том монтируется в /app/data, туда же указывает база.
      HG_DATA_DIR: /app/data
      HG_DB_URL: sqlite:////app/data/hronograf.db
    volumes:
      - hronograf-data:/app/data
    # Привязка к 127.0.0.1 обязательна: иначе Docker открыл бы порт на всех
    # интерфейсах в обход брандмауэра, и приложение торчало бы наружу без
    # сертификата. Так до него дотянется только nginx с этой же машины.
    ports:
      - "127.0.0.1:${HG_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Нужен только когда порты 80 и 443 свободны. Если на сервере уже есть
  # nginx, этот сервис не запускается: профиль tls по умолчанию выключен.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      HG_DOMAIN: "${HG_DOMAIN:?укажите домен в .env, например HG_DOMAIN=ismc.example.ru}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hronograf-data:
  caddy-data:
  caddy-config:
