# Отдельный сайт для Хронографа на сервере, где nginx уже обслуживает
# другие домены. Существующие конфигурации этот файл не трогает.
#
# Установка:
#   sudo cp deploy/nginx/hronograf.conf /etc/nginx/sites-available/hronograf
#   отредактируйте server_name под свой домен
#   sudo ln -s /etc/nginx/sites-available/hronograf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем сертификат:
#   sudo certbot --nginx -d ismc.example.ru
#
# Certbot сам допишет сюда блок listen 443 с путями к сертификату и
# перенаправление с http на https.

server {
    listen 80;
    listen [::]:80;

    server_name ismc.example.ru;

    # Загрузка графика работ идёт файлом, стандартного лимита в 1 МБ мало.
    client_max_body_size 32m;

    access_log /var/log/nginx/hronograf-access.log;
    error_log  /var/log/nginx/hronograf-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # «Машина времени» отдаёт поток событий: буферизация его задержала бы
        # до конца ответа, а таймаут по умолчанию оборвал бы на середине.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
